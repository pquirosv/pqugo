{{ define "main" }}
  {{- $terms := .Data.Terms.Alphabetical | default (slice) -}}
  {{- if eq (len $terms) 0 -}}
    <p>No terms available yet.</p>
  {{- else -}}
    <ul>
      {{- range $terms -}}
        <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> ({{ .Count }})</li>
      {{- end -}}
    </ul>
  {{- end -}}
{{ end }}
